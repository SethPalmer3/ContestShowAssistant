{% extends "ui/base.html" %}

{% block content %}
<div class="score-keeper-container">
	<h2>Keep Score: <span id="header-block"></span></h2>
    
    <div class="contestants-list">
        <!-- Iterate through all contestants passed from the view -->
        {% for contestant in contestants %}
            <div class="contestant-row" style="display: flex; align-items: center; margin-bottom: 15px; gap: 15px;">
                <strong style="width: 200px;">{{ contestant.display_name }}</strong>
                
                <!-- Individual form for each contestant -->
                <form method="POST" action="{% url 'submit_score' %}" class="score-form" style="display: flex; gap: 10px;">
                    {% csrf_token %}
                    
                    <!-- Hidden field to identify which contestant is being scored -->
                    <input type="hidden" name="contestant_id" value="{{ contestant.id }}">
                    
                    <!-- Enter-able score input -->
                    <input type="number" 
                           name="score" 
                           placeholder="Score" 
                           required 
                           style="width: 20em;">
                           
					<label style=" padding-left: 1.5em; padding-right: 1.5em;">
						TB
						<br>
						<input type="checkbox" name="tie-breaker" id="is-tie-breaker" style="accent-color: #0056b3; width: 1.5em; height: 1.5em;" {% if is_completed %}checked{% endif %}>
					</label>
                    <!-- Individual submit button -->
					<button type="submit" style="visibility: {% if is_finalized %}hidden{% else %}visible{% endif %}">Submit</button>
                </form>
            </div>
        {% empty %}
            <p>No contestants found. Please add contestants to the system.</p>
        {% endfor %}
    </div>
</div>

<!-- Optional: Add JavaScript to submit scores asynchronously without reloading the page -->
<script>
	async function updateHeader() {
		const stateResponse = await fetch('/api/state/');
		const stateData = await stateResponse.json();
		const headerContainer = document.getElementById("header-block");
		if(stateData.mode !== 'EVENT' || !stateData.current_event_id){
			headerContainer.innerHTML = `Waiting for next Event...`;
		}else{
			headerContainer.innerHTML = `${stateData.current_event}`;
			headerContainer.style.color = "#0056b3";
		}
		<!-- document.getElementsByName("tie-breaker").forEach(chk => { -->
		<!-- 	chk.checked = stateData.event_completed && !stateData.event_finalized; -->
		<!-- }); -->
	}

document.querySelectorAll('.score-form').forEach(form => {
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent the default page reload
		submit_form = e.target;
		contestant_id = submit_form.querySelector('[name="contestant_id"]').value;
		score_value = submit_form.querySelector('[name="score"]').value;
		isTieBreaker = submit_form.querySelector('[id="is-tie-breaker"]').checked;
        
        const url = this.action;
        
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json', 
				'X-CSRFToken': csrftoken,
			},
			body: JSON.stringify({
				entity_id: contestant_id,
				is_group: {{is_group}}, // Tell the API if it's grading a group or a single person
				value: score_value,
				is_tie_breaker: isTieBreaker,
			})
        })
        .then(response => {
            if (response.ok) {
                // Flash the background green to indicate success
                const row = this.closest('.contestant-row');
                row.style.backgroundColor = '#d4edda';
                setTimeout(() => { row.style.backgroundColor = 'transparent'; }, 1000);
                this.reset(); 
            } else {
                alert('Error saving score.');
            }
        })
        .catch(error => console.error('Error:', error));
    });
});
updateHeader();
<!-- setInterval(updateHeader, 5000); -->
</script>
{% endblock %}
